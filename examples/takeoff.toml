# BOQ rules for examples/tank_farm.dxf
#
#   dxf-takeoff examples/tank_farm.dxf --out-units m --group-by-attrib SIZE --rules examples/takeoff.toml
#
# Each [[item]] becomes one BOQ line. Layer and block patterns accept wildcards
# (* ? [abc]) and are case-insensitive. Quantities are converted to `unit`.
# The rates below are ILLUSTRATIVE ONLY - replace them with your own.

[settings]
title = "Tank farm T-100: piping and civil works"
currency = "USD"

# --- 1. Piping (lengths along the centreline, bends included) --------------
[[item]]
code = "1.01"
description = "CS pipe DN200 SCH40 A106-B, product lines"
match_layer = "P-PROD-200"
quantity = "length"
unit = "m"
waste = 5
rate = 95.00

[[item]]
code = "1.02"
description = "CS pipe DN150 SCH40 A106-B, product lines"
match_layer = "P-PROD-150"
quantity = "length"
unit = "m"
waste = 5
rate = 68.00

[[item]]
code = "1.03"
description = "CS pipe DN100, cooling water header"
match_layer = "P-CW-100"
quantity = "length"
unit = "m"
waste = 5
rate = 41.00

[[item]]
code = "1.04"
description = "CS pipe DN50, cooling water branches"
match_layer = "P-CW-50"
quantity = "length"
unit = "m"
waste = 7.5
rate = 22.50

[[item]]
code = "1.05"
description = "HDPE pipe DN150 PN16, fire water ring main"
